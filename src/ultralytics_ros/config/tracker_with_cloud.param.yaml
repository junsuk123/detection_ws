# ─────────────────────────────────────────────────────────────
# 공통(모든 노드) 기본값: YOLO 트래커 노드가 읽는 파라미터들
# ─────────────────────────────────────────────────────────────
/**:
  ros__parameters:
    # 입력 토픽(상대 경로)  ← 네임스페이스(/camera1, /camera3) 자동 적용
    input_image_topic: "image_raw"      # 권장 키
    input_topic: "image_raw"            # 기존 구현 호환 alias
    camera_info_topic: "camera_info"

    # 출력 토픽(상대 경로)
    yolo_result_topic: "yolo_result"            # 권장 키
    result_topic: "yolo_result"                 # alias
    yolo_result_image_topic: "yolo_image"
    result_image_topic: "yolo_image"            # alias

    # YOLO 모델/추론
    yolo_model: "best.pt"        # models 폴더 상대 경로
    model_path: ""               # launch에서 설정
    conf_thres: 0.2
    iou_thres: 0.45
    max_det: 300
    device: "cuda:0"

    # 추적기
    tracker: "bytetrack.yaml"
    track_high_thresh: 0.6
    track_low_thresh: 0.1
    new_track_thresh: 0.7
    track_buffer: 30
    match_thresh: 0.8
    frame_rate: 30

    # 시각화
    force_bbox: true             # 마스크 무시하고 BBOX 사용(필요에 따라 false)
    result_conf: true
    result_labels: true
    result_boxes: true
    result_line_width: 1
    result_font_size: 1
    result_font: "Arial.ttf"
    publish_debug_image: true    # ★ 결과 이미지 퍼블리시 보장
    # 구현에 따라 쓰는 경우:
    publish_image: true
    # publish_debug_pointcloud: false

    # (일부는 트래커 경로에서 미사용이지만 유지)
    cluster_tolerance: 0.25
    voxel_leaf_size: 0.01
    min_cluster_size: 5
    max_cluster_size: 500

    # 거리/높이 필터
    min_detection_range: 1.0
    max_detection_range: 50.0
    min_height: -2.0
    max_height: 3.0

    # 성능/동기화(노드 구현에 따라 사용)
    processing_frequency: 10.0
    skip_frame_count: 0
    point_cloud_timeout: 1.0
    image_timeout: 0.1
    sync_slop: 0.05
    queue_size: 10

    # 모니터링
    debug_mode: true
    publish_processing_time: true
    log_performance: false

# ─────────────────────────────────────────────────────────────
# 3D 트래커 노드 전용 설정(노드명: tracker_3d_node)
# ─────────────────────────────────────────────────────────────
/tracker_3d_node:
  ros__parameters:
    # LiDAR(클러스터) 입력: 실제 발행되는 쪽으로 하나만 선택
    # 예) euclidean_cluster_gpu 쓰면 아래 줄, range_image_clustering 쓰면 /pointcloud/clustered 로 바꾸세요.
    lidar_topic: "/pointcloud/clustered"

    # 3D 결과 출력(전역으로 1개면 절대 경로 유지 OK)
    yolo_3d_result_topic: "/yolo_3d_result"

    # QoS 맞추기: 퍼블리셔가 RELIABLE면 true, BEST_EFFORT면 false
    use_reliable_lidar: false

    # 다중 카메라(런치에서 덮어씀)
    active_cameras: []
    camera_info_topics: []      # 예: ["/camera1/camera_info", "/camera3/camera_info"]
    yolo_result_topics: []      # 예: ["/camera1/yolo_result", "/camera3/yolo_result"]

    # 매칭 파라미터
    force_bbox: true            # 위 공통과 동일하게 유지
    min_points_in_bbox: 20
    min_ratio_in_cluster: 0.0
    max_clusters_per_det: 2
    exclusive_cluster: true
