/**:
  ros__parameters:
    # 입/출력 토픽
    input_topic: "/pointcloud/ground_removed"
    output_cloud_topic: "/pointcloud/clustered/boxes"
    output_markers_topic: "/pointcloud/clustered/markers"

    # QoS 설정
    use_sensor_data_qos: true      # 센서 데이터에 적합한 QoS 사용 (BEST_EFFORT)
    qos_history_depth: 5           # QoS 히스토리 깊이

    # 레인지 이미지 파라미터 - 소형 객체 분리를 위한 해상도 증가
    range_image_width: 720        # 0.5° → 0.25° 해상도로 증가 (2배 정밀하게)
    range_image_height: 64        # 센서 채널보다 높게 설정하여 보간 효과
    
    # 클러스터링 파라미터 - 소형 물체 분리용 미세 조정
    angle_threshold: 0.07         # 각도 임계값 더 엄격하게 (4도 정도)
    distance_threshold: 0.03      # 거리 임계값 감소 (3cm - 콘 간격의 1/3)
    min_cluster_size: 2           # 최소 클러스터 크기는 유지
    max_cluster_size: 200         # 최대 크기 제한 유지
    
    # 근거리 클러스터링 최적화
    enable_adaptive_threshold: true
    min_distance_for_adaptive: 2.0   # 적응형 시작 거리를 더 가깝게
    max_adaptive_factor: 2.0         # 최대 적응 계수 감소
    
    # 깊이 불연속 기반 클러스터링 파라미터
    depth_discontinuity_threshold: 0.08  # 더 엄격한 깊이 불연속 검출 (반으로 감소)
    
    # 다단계 클러스터링 설정 - 소형 객체에 최적화
    use_multi_level_clustering: false    # 깊이 불연속 기반 방식이 더 효과적
    
    # 클러스터 병합 설정 - 과도한 병합 방지
    merge_clusters: true               # 소형 콘 분리를 위해 병합 비활성화
    cluster_merge_threshold: 0.15       # 병합이 필요한 경우 임계값 감소
    use_improved_merge_criteria: true   
    merge_box_expansion_factor: 1.03    # 확장 계수 최소화 (거의 정확한 경계 박스 사용)
    
    # 클러스터 품질 평가 - 소형 객체 보존
    evaluate_cluster_quality: false     # 소형 클러스터 보존을 위해 비활성화
    
    # 고급 분리 옵션 - 소형 객체에 최적화
    enable_small_object_refinement: false  # 새 옵션: 소형 객체 추가 처리 활성화
    small_object_max_volume: 0.01         # 새 옵션: 소형 객체 최대 부피 (0.01m³)
    min_object_separation: 0.05           # 새 옵션: 최소 객체 분리 거리 (5cm)

    # 시각화 파라미터
    marker_lifetime: 0.2          # 마커 라이프타임 (초)
    point_size: 3.0               # 포인트 시각화 크기
    
    # 프레임 설정
    fixed_frame: "velodyne"       # 고정 프레임 ID
    
    # 거리별 임계값 조정
    enable_adaptive_threshold: true
    min_distance_for_adaptive: 5.0  
    max_adaptive_factor: 4.0        # 더 큰 적응 계수

    # ====== ROI 파라미터 (관심영역) ======
    use_roi_filter: true          # ROI 필터링 사용 여부
    roi_x_min: 0.0                # x축 최소 거리(m)
    roi_x_max: 1.2                # x축 최대 거리(m) 
    roi_y_min: -0.3               # y축 최소 거리(m)
    roi_y_max: 0.5                # y축 최대 거리(m)
    roi_z_min: -0.5               # z축 최소 거리(m)
    roi_z_max: 1.5                # z축 최대 거리(m)

    # 다단계 클러스터링 설정
    use_multi_level_clustering: true   
    clustering_levels: 2
    distance_threshold_step: 0.10  
    angle_threshold_step: 0.07      

    # 클러스터 품질 평가
    evaluate_cluster_quality: true
    min_cluster_density: 0.01
    max_cluster_elongation: 5.0

    # 클러스터 병합 설정
    merge_clusters: true
    cluster_merge_threshold: 0.3
    cluster_merge_angle: 0.5
    use_improved_merge_criteria: true    # 개선된 병합 기준 사용 (경계 상자 교차 검사)
    merge_box_expansion_factor: 1.1      # 병합 검사를 위한 경계 상자 확장 계수

    # 포인트 특성 기반 클러스터링
    use_point_features: true   # 성능 영향이 있으므로 선택적 사용
    feature_weight: 0.5
    curvature_threshold: 0.05
    normal_angle_weight: 0.3
    
    # 자동 튜닝 설정
    enable_auto_tuning: true   # 실험적 기능
    auto_tuning_target_clusters: 20
    auto_tuning_max_iterations: 5

    # 성능 최적화
    enable_acos_optimization: true       # acos 호출 최적화 사용
